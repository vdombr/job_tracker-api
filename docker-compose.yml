services:
  app:
    build: .
    ports:
      - "9292:9292"
    environment:
      DATABASE_URL: postgres://rivulet:rivulet@db:5432/api_development
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rivulet
      POSTGRES_PASSWORD: rivulet
      POSTGRES_DB: api_development
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivulet"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db:
